# No frontend here — this service is an API-only gateway (SAP/ERP connectors and KRA/VSCU
# devices call it directly; there is no browser-facing site to serve alongside it). Compare
# notification-service's nginx site, which fronts a built SPA as well as its API.
#
# TODO before installing:
#   - Replace kra-vscu.dg.com with the real production domain.
#   - TLS: this box currently runs everything on plain HTTP (apparently behind another proxy
#     layer upstream) — confirm whether that's still true for this domain, or whether it needs
#     its own certbot certificate. A fiscal integration handling KRA PINs/signatures over plain
#     HTTP on the public path is not acceptable for go-live.
#
# Install:
#   sudo ln -s /home/dev/web_files/kra_vscu/production/kra_vscu_backend/deploy/nginx/kra-vscu-backend.conf \
#     /etc/nginx/sites-available/kra-vscu-backend.conf
#   sudo ln -s /etc/nginx/sites-available/kra-vscu-backend.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (deploy/install.sh does this for you.)

server {
    listen 80;
    server_name kra-vscu.dg.com;

    access_log /var/log/nginx/kra-vscu-backend-access.log;
    error_log /var/log/nginx/kra-vscu-backend-error.log;

    location / {
        proxy_pass http://unix:/var/sockets/kra_vscu_backend_api.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # app/api/v1/endpoints/health.py — liveness/readiness, no auth required.
    location = /v1/health {
        proxy_pass http://unix:/var/sockets/kra_vscu_backend_api.sock/v1/health;
        proxy_set_header Host $host;
    }
}
