name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oscu
          POSTGRES_PASSWORD: oscu
          POSTGRES_DB: oscu_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oscu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://oscu:oscu@localhost:5432/oscu_gateway
      TEST_DATABASE_URL: postgresql+asyncpg://oscu:oscu@localhost:5432/oscu_gateway_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      KRA_ENV: sandbox

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate ephemeral secrets for this run
        # Real values, not placeholders — Fernet(key) raises on an invalid key, and this
        # touches real code paths (device init, JWT issuance) in the test suite. Generated
        # fresh per run rather than checked in, since there's no reason a throwaway CI
        # database's secrets need to be long-lived or shared.
        run: |
          echo "CMC_KEY_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          echo "ADMIN_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Create test database
        run: PGPASSWORD=oscu psql -h localhost -U oscu -d postgres -c 'CREATE DATABASE "oscu_gateway_test" OWNER oscu;'

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (black)
        run: black --check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app.services --cov=app.api --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t oscu-gateway:ci .

  # Manual/optional only (spec's own instruction: these need real network + real sandbox
  # credentials as secrets, which most CI runs won't have). Trigger via "Run workflow" in the
  # Actions tab; on push/PR this job is skipped entirely, not just soft-failed.
  sandbox-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint-type-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oscu
          POSTGRES_PASSWORD: oscu
          POSTGRES_DB: oscu_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oscu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://oscu:oscu@localhost:5432/oscu_gateway
      TEST_DATABASE_URL: postgresql+asyncpg://oscu:oscu@localhost:5432/oscu_gateway_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      KRA_ENV: sandbox
      KRA_SANDBOX_INTEGRATION_TESTS: "1"
      KRA_SANDBOX_TEST_TIN: ${{ secrets.KRA_SANDBOX_TEST_TIN }}
      KRA_SANDBOX_TEST_BHF_ID: ${{ secrets.KRA_SANDBOX_TEST_BHF_ID }}
      KRA_SANDBOX_TEST_CMC_KEY: ${{ secrets.KRA_SANDBOX_TEST_CMC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate ephemeral secrets for this run
        run: |
          echo "CMC_KEY_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Create test database
        run: PGPASSWORD=oscu psql -h localhost -U oscu -d postgres -c 'CREATE DATABASE "oscu_gateway_test" OWNER oscu;'

      - name: Run sandbox integration tests
        run: pytest tests/integration/ -v
