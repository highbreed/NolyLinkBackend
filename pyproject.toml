[project]
name = "oscu-gateway"
version = "0.1.0"
description = "FastAPI integration gateway between client ERP/POS systems and KRA eTIMS OSCU"
requires-python = ">=3.11"
readme = "docs/README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "cryptography>=42.0,<44.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<6.0",
    "slowapi>=0.1.9,<1.0",
    "prometheus-client>=0.20,<1.0",
    "python-json-logger>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    # Production process manager (deploy/) — uvicorn alone (the dev/Docker CMD) has no
    # multi-worker process supervision of its own; every sibling service on this box runs
    # behind gunicorn's UvicornWorker for that reason.
    "gunicorn>=22.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<1.0",
    "testcontainers[postgres]>=4.7,<5.0",
    "ruff>=0.5,<1.0",
    "black>=24.4,<25.0",
    "mypy>=1.10,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. in argument defaults is the framework's own idiom, not a
# mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async ORM bridges sync/async execution via greenlet internally; without
# telling coverage.py to follow execution across greenlet switches, statements that
# genuinely ran (inside any async DB-touching code — nearly everything in this app) show up
# as "not covered", which is a measurement artifact, not a real gap.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
